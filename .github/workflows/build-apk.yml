name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}' > java_version.txt
          cat java_version.txt
          if [ "$(cat java_version.txt)" -lt 17 ]; then
            echo "Java version is lower than 17"
            exit 1
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkeypair -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            if [ ! -f ./debug.keystore ]; then
              echo "Keystore creation failed"
              exit 1
            fi
            echo "Keystore created successfully."
          else
            echo "Keystore already exists."
          fi

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK exists."
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "APK missing!"
            find app/build/outputs/apk -name "*.apk"
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          mkdir -p release_asset
          cp app/build/outputs/apk/debug/app-debug.apk release_asset/app-debug.apk
          echo "path=release_asset/app-debug.apk" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          # Create unique tag
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          echo "Using tag: $TAG"
          
          ASSET_PATH=${{ steps.prepare_asset.outputs.path }}
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Release asset missing!"
            exit 1
          fi
          
          gh release create "$TAG" \
            --title "Debug APK Build #${{ github.run_number }}" \
            --target "${{ github.sha }}" \
            --notes "This is an automatically generated debug APK.
            Built by GitHub Actions.
            Run number: ${{ github.run_number }}
            Run attempt: ${{ github.run_attempt }}
            Source commit: ${{ github.sha }}
            APK is intended for testing.
            APK is not a Play Store production release.
            APK is signed only with a temporary debug keystore." \
            --latest \
            "$ASSET_PATH"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.create_release.outcome }}" == "success" ]; then
            echo "Release created successfully."
            gh release view --json tagName,name,url
            echo "APK filename: app-debug.apk"
            
            # Print GITHUB_REPOSITORY for summary
            echo "GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
            
            echo "### DIRECT APK DOWNLOAD" >> $GITHUB_STEP_SUMMARY
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk" >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact named app-debug-apk remains available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning:: Release publishing failed."
            echo "The APK build succeeded, and app-debug-apk remains available as a backup."
          fi
